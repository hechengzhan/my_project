services:
  - type: web
    name: lime-campus-market
    runtime: docker
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: QWEN_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: QWEN_MODEL
        value: qwen3.6-flash
    disk:
      name: campus-market-data
      mountPath: /data
      sizeGB: 1

